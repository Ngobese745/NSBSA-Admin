<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NSBSA Administrative Management Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NSBSA Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NSBSA Admin</title>
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at center, #11151c 0%, #050505 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      font-family: 'Outfit', sans-serif;
      position: relative;
    }
    
    /* Background Glow Effect */
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse-glow 4s infinite alternate ease-in-out;
    }

    .logo-container {
      position: relative;
      margin-bottom: 50px;
      animation: float 6s infinite ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 450px;
      height: auto;
      filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.5));
    }

    /* Premium Dual-Ring Loader */
    .loader-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      box-sizing: border-box;
    }

    .loader-ring-outer {
      border-top-color: rgba(212, 175, 55, 0.8);
      border-bottom-color: rgba(212, 175, 55, 0.2);
      animation: spin 1.5s linear infinite;
    }

    .loader-ring-inner {
      top: 8px;
      left: 8px;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      border-left-color: rgba(255, 255, 255, 0.5);
      border-right-color: rgba(255, 255, 255, 0.1);
      animation: spin-reverse 2s linear infinite;
    }

    .loading-text {
      margin-top: 30px;
      color: #D4AF37;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 400;
      opacity: 0;
      animation: fade-in-up 1s ease-out forwards;
      animation-delay: 0.5s;
    }

    /* Animations */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulse-glow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 0.8; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="glow"></div>
    <div class="logo-container">
      <img class="logo" src="full_logo.png" alt="NSBSA Logo">
    </div>
    <div class="loader-wrapper">
      <div class="loader-ring loader-ring-outer"></div>
      <div class="loader-ring loader-ring-inner"></div>
    </div>
    <div class="loading-text">Authenticating System...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
