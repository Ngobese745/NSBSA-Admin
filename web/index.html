<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NSBSA Administrative Management Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NSBSA Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NSBSA Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .logo {
      width: 300px;
      height: auto;
      margin-bottom: 40px;
      animation: pulse 2s infinite ease-in-out;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(212, 175, 55, 0.1);
      border-radius: 50%;
      display: inline-block;
      position: relative;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    .loader::after {
      content: '';  
      box-sizing: border-box;
      position: absolute;
      left: 0;
      top: 0;
      background: #D4AF37;
      width: 12px;
      height: 12px;
      transform: translate(-50%, 50%);
      border-radius: 50%;
    }
    .loading-text {
      margin-top: 24px;
      color: #D4AF37;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    } 
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <img class="logo" src="full_logo.png" alt="NSBSA Logo">
    <span class="loader"></span>
    <div class="loading-text">Initializing NSBSA System...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
